<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#eee8dc">
  <title>Nazir &amp; Sally — AR Invitation</title>
  <script src="assets/aframe.min.js"></script>
  <script src="assets/mindar-image-aframe.prod.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171411; }
    #start, #guide { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; text-align: center; }
    #start { background: radial-gradient(circle at 50% 35%, #f7f2e8, #d9d0c0); color: #3f3429; }
    .card { width: min(420px, 100%); padding: 30px 24px; border: 1px solid rgba(63,52,41,.22); background: rgba(255,255,255,.28); backdrop-filter: blur(12px); border-radius: 22px; box-shadow: 0 18px 55px rgba(56,43,30,.18); }
    h1 { margin: 0 0 10px; font-family: Georgia, serif; font-weight: 400; font-size: 30px; }
    p { margin: 0 0 22px; line-height: 1.45; }
    button { border: 0; border-radius: 999px; padding: 14px 24px; background: #44372c; color: #fffaf2; font-size: 16px; cursor: pointer; }
    #guide { inset: auto 16px calc(22px + env(safe-area-inset-bottom)); z-index: 10; pointer-events: none; }
    #guide span { max-width: 360px; padding: 11px 16px; background: rgba(28,24,20,.76); border-radius: 999px; box-shadow: 0 7px 30px rgba(0,0,0,.25); }
    #sound { position: fixed; z-index: 15; right: 16px; top: calc(16px + env(safe-area-inset-top)); display: none; padding: 11px 15px; font-size: 14px; background: rgba(28,24,20,.78); }
    #error { display:none; margin-top:14px; color:#7e2e29; }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="start">
    <div class="card">
      <h1>Nazir &amp; Sally</h1>
      <p>Point your camera at the invitation image to reveal the animation.</p>
      <button id="startButton">Open AR Camera</button>
      <div id="error">Camera access is required. Please allow it, then try again.</div>
    </div>
  </div>
  <div id="guide"><span>Point the camera at the invitation</span></div>
  <button id="sound">Turn sound on</button>

  <a-scene
    mindar-image="imageTargetSrc: assets/invitation.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 0.01"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="20000">
      <video id="inviteVideo" src="assets/invitation.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane position="0 0 0.01" width="0.5625" height="1" material="src: #inviteVideo; shader: flat; transparent: false"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const start = document.querySelector('#start');
    const startButton = document.querySelector('#startButton');
    const error = document.querySelector('#error');
    const guide = document.querySelector('#guide');
    const sound = document.querySelector('#sound');
    const target = document.querySelector('#target');
    const video = document.querySelector('#inviteVideo');
    let started = false;

    startButton.addEventListener('click', async () => {
      if (started) return;
      started = true;
      error.style.display = 'none';
      startButton.textContent = 'Opening camera…';
      try {
        await scene.systems['mindar-image-system'].start();
        start.style.display = 'none';
      } catch (e) {
        started = false;
        error.style.display = 'block';
        startButton.textContent = 'Try Again';
      }
    });

    target.addEventListener('targetFound', async () => {
      guide.style.display = 'none';
      sound.style.display = 'block';
      video.currentTime = 0;
      try { await video.play(); } catch (e) {}
    });
    target.addEventListener('targetLost', () => {
      guide.style.display = 'grid';
      video.pause();
    });
    sound.addEventListener('click', async () => {
      video.muted = !video.muted;
      sound.textContent = video.muted ? 'Turn sound on' : 'Sound on';
      try { await video.play(); } catch (e) {}
    });
  </script>
</body>
</html>
